<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100">
  <defs>
    <style>
      @keyframes twinkle  { 0%,100%{opacity:1}   50%{opacity:0.15} }
      @keyframes twinkle2 { 0%,100%{opacity:0.5} 40%{opacity:1}    70%{opacity:0.1} }
      @keyframes fadeIn   { from{opacity:0} to{opacity:1} }
      .fs { animation: twinkle  3.2s infinite ease-in-out; fill: white; }
      .fs2{ animation: twinkle2 4.8s infinite ease-in-out; fill: #fde68a; }
      .txt{ animation: fadeIn 1.4s 0.2s ease both; }
    </style>

    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2d0a0a"/>
      <stop offset="50%"  stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0f0c1a"/>
    </linearGradient>

    <linearGradient id="ftopLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0f0c1a" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#ec4899"/>
      <stop offset="65%"  stop-color="#f97316"/>
      <stop offset="100%" stop-color="#0f0c1a" stop-opacity="0"/>
    </linearGradient>

    <pattern id="fdots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#fff"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="100" fill="url(#fbg)"/>

  <!-- Grid dots -->
  <rect width="900" height="100" fill="url(#fdots)" opacity="0.06"/>

  <!-- Top glow line -->
  <rect x="0" y="0" width="900" height="1.5" fill="url(#ftopLine)" opacity="0.9"/>

  <!-- Stars -->
  <circle class="fs"  cx="60"  cy="35" r="1.2" style="animation-delay:0.5s"/>
  <circle class="fs2" cx="200" cy="20" r="1"   style="animation-delay:1.2s"/>
  <circle class="fs"  cx="380" cy="45" r="0.9" style="animation-delay:0.2s"/>
  <circle class="fs2" cx="500" cy="15" r="1.3" style="animation-delay:1.8s"/>
  <circle class="fs"  cx="680" cy="38" r="1"   style="animation-delay:0.7s"/>
  <circle class="fs2" cx="820" cy="22" r="1.1" style="animation-delay:1.4s"/>
  <circle class="fs"  cx="140" cy="65" r="0.8" style="animation-delay:2.1s"/>
  <circle class="fs2" cx="750" cy="60" r="1"   style="animation-delay:0.9s"/>

  <!-- Corner brackets -->
  <g stroke="#ec4899" stroke-width="1.5" fill="none" opacity="0.5">
    <polyline points="18,8  10,8  10,22"/>
    <polyline points="882,8 890,8 890,22"/>
    <polyline points="18,92  10,92  10,78"/>
    <polyline points="882,92 890,92 890,78"/>
  </g>

  <!-- Footer text line 1 -->
  <text
    class="txt"
    x="450" y="42"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Courier New', monospace"
    font-size="13"
    letter-spacing="3"
    fill="#f97316"
    opacity="0.75"
  >thanks for stopping by</text>

  <!-- Footer text line 2 -->
  <text
    class="txt"
    x="450" y="62"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Courier New', monospace"
    font-size="13"
    letter-spacing="3"
    fill="#f97316"
    opacity="0.75"
  >you're awesome 🤍</text>
</svg>
